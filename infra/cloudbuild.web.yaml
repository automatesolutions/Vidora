# Builds the web image and deploys it to Cloud Run. Run from the repo root: pnpm deploy:web
# Secrets and env vars are set once on the service (README "Deploy") and kept across deploys.
substitutions:
  _REGION: asia-southeast1
  _SERVICE: vidora-web
  _APP_URL: https://vidora-web-657635713769.asia-southeast1.run.app
  _ENABLE_DESIGN_SYSTEM: "true"
  # White label: the operator workspace whose Higgsfield connection makes every customer's videos.
  _PLATFORM_WORKSPACE_ID: "ws_01M501WJ3K762SAX38HJ2HXPYD"
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/vidora/web

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - -f
      - infra/web.Dockerfile
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - ENABLE_DESIGN_SYSTEM=${_ENABLE_DESIGN_SYSTEM}
      - -t
      - ${_IMAGE}:${BUILD_ID}
      - -t
      - ${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=vidora-web@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      - --network=default
      - --subnet=default
      - --vpc-egress=private-ranges-only
      - --update-env-vars=NEXT_PUBLIC_APP_URL=${_APP_URL},APP_URL=${_APP_URL},STORAGE_ENDPOINT=https://storage.googleapis.com,STORAGE_BUCKET=vidora-media-510913,STORAGE_REGION=auto,PLATFORM_WORKSPACE_ID=${_PLATFORM_WORKSPACE_ID}
      - --update-secrets=DATABASE_URL=database-url:latest,BETTER_AUTH_SECRET=better-auth-secret:latest,TOKEN_ENCRYPTION_KEYS=token-encryption-keys:latest,OAUTH_STATE_SECRET=oauth-state-secret:latest,HIGGSFIELD_WEBHOOK_SECRET=higgsfield-webhook-secret:latest,STORAGE_ACCESS_KEY_ID=storage-access-key-id:latest,STORAGE_SECRET_ACCESS_KEY=storage-secret-access-key:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest
