# AutoShorts Studio services.
#
# Local dev:   docker compose -f infra/docker-compose.yml --env-file .env --profile dev up -d
#              (Postgres on localhost:5433, Redis on localhost:6380, S3 storage on localhost:9000;
#              the web app and worker run on the host with pnpm)
# Production:  docker compose -f infra/docker-compose.yml --env-file .env --profile prod up -d
#              (Redis + the worker container; Postgres is managed and storage is Cloudflare R2)

name: vidora

services:
  # BullMQ queues: generation, campaign runs, YouTube uploads.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ must never lose queued jobs to memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Local development only: the app database.
  vidora-db:
    profiles: ["dev"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidora
      POSTGRES_PASSWORD: vidora
      POSTGRES_DB: vidora
    ports: ["127.0.0.1:5433:5432"]
    volumes: [vidora-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidora -d vidora"]
      interval: 5s
      retries: 10

  # Local development only: S3-compatible storage standing in for Cloudflare R2 (same client code).
  # Credentials are dev-only and live in infra/storage/s3.json (they match .env.example).
  # `pnpm storage:seed` creates the bucket and sets CORS.
  storage:
    profiles: ["dev"]
    image: chrislusf/seaweedfs:4.47 # pinned; MinIO no longer publishes community images
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256", "-volume.max=20"]
    ports: ["127.0.0.1:9000:8333"]
    volumes:
      - storage:/data
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro

  worker:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

volumes:
  redis:
  vidora-db:
  storage:
