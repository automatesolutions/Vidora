# Vidora internal services (docs/PLAN.md §3–4).
#
# Local dev:   docker compose -f infra/docker-compose.yml --env-file .env --profile dev up -d
#              (adds the app Postgres on localhost:5433; the web app and worker run on the host with pnpm)
# Production:  docker compose -f infra/docker-compose.yml --env-file .env --profile prod up -d
#              (adds the Vidora worker container; the app DB is Neon, so no `dev` profile)
#
# n8n has NO public port. The editor binds to 127.0.0.1 only; reach it over SSH or Tailscale in production.

name: vidora

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-db
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  # Secrets come from files (Docker secrets), so Code nodes reading $env see paths, not values.
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_db_password
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
  GENERIC_TIMEZONE: UTC
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_UNVERIFIED_PACKAGES_ENABLED: "false" # no community packages
  N8N_RUNNERS_TASK_TIMEOUT: "300"
  # Code nodes run in separate runner containers (below), away from n8n's files and secrets.
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  # Shell access from workflows is off.
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh"]'
  # Code nodes read these with $env. n8n hands its own environment to the runner, so keep real secrets out of it.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  VIDORA_INBOUND_SECRET: ${VIDORA_TO_N8N_SECRET:?set VIDORA_TO_N8N_SECRET in .env}
  VIDORA_CALLBACK_SECRET: ${N8N_TO_VIDORA_SECRET:?set N8N_TO_VIDORA_SECRET in .env}
  VIDORA_APP_URL: ${N8N_VIDORA_APP_URL:-http://host.docker.internal:3010}

# Each n8n process that runs workflows gets its own runner sidecar.
x-runner-env: &runner-env
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set N8N_RUNNERS_AUTH_TOKEN in .env} # not passed to Code nodes (task-runners.json)
  N8N_RUNNERS_TASK_TIMEOUT: "300"
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
  GENERIC_TIMEZONE: UTC

services:
  n8n-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes: [n8n-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.42.4 # pinned; upgrade on purpose, after reading the release notes
    restart: unless-stopped
    environment:
      <<: *n8n-env
      N8N_WEBHOOK_URL: http://n8n:5678/
    secrets: [n8n_db_password, n8n_encryption_key, n8n_runners_auth_token]
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      n8n-db: { condition: service_healthy }
      redis: { condition: service_healthy }

  n8n-worker:
    image: n8nio/n8n:2.42.4
    restart: unless-stopped
    command: ["worker", "--concurrency=5"]
    environment: *n8n-env
    secrets: [n8n_db_password, n8n_encryption_key, n8n_runners_auth_token]
    volumes: [n8n:/home/node/.n8n]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [n8n]
    # To scale: copy this service and its runner as n8n-worker-2 / n8n-worker-2-runner.

  n8n-runner:
    image: n8nio/runners:2.42.4
    restart: unless-stopped
    command: ["javascript"] # JS only; the Python runner is not used
    environment:
      <<: *runner-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    volumes: ["./n8n/task-runners.json:/etc/n8n-task-runners.json:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [n8n]

  n8n-worker-runner:
    image: n8nio/runners:2.42.4
    restart: unless-stopped
    command: ["javascript"] # JS only; the Python runner is not used
    environment:
      <<: *runner-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
    volumes: ["./n8n/task-runners.json:/etc/n8n-task-runners.json:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [n8n-worker]

  # Local development only: the app database (production uses Neon).
  vidora-db:
    profiles: ["dev"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidora
      POSTGRES_PASSWORD: vidora
      POSTGRES_DB: vidora
    ports: ["127.0.0.1:5433:5432"]
    volumes: [vidora-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidora -d vidora"]
      interval: 5s
      retries: 10

  # Local development only: S3-compatible storage standing in for Cloudflare R2 (same client code).
  # Credentials are dev-only and live in infra/storage/s3.json (they match .env.example).
  # `pnpm storage:seed` creates the bucket, sets CORS, and uploads the stub pipeline's sample video.
  storage:
    profiles: ["dev"]
    image: chrislusf/seaweedfs:4.47 # pinned; MinIO no longer publishes community images
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256", "-volume.max=20"]
    ports: ["127.0.0.1:9000:8333"]
    volumes:
      - storage:/data
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro

  worker:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/vidora/generate
      VIDORA_TO_N8N_SECRET: ${VIDORA_TO_N8N_SECRET}
      APP_URL: ${APP_URL:?set APP_URL in .env}
    depends_on: [n8n]

secrets:
  n8n_db_password:
    environment: N8N_DB_PASSWORD
  n8n_encryption_key:
    environment: N8N_ENCRYPTION_KEY
  n8n_runners_auth_token:
    environment: N8N_RUNNERS_AUTH_TOKEN

volumes:
  n8n-db:
  n8n:
  redis:
  vidora-db:
  storage:
